<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostOS // v1.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand"><span class="dot"></span> GHOST_OS v1.2</div>
    <div class="sys-stats">
      <span id="hostBadge">HOST: kerala-node</span>
      <span id="missionBadge">MISSION 01: RECON</span>
      <span id="osClock">--:--:--</span>
    </div>
  </header>

  <!-- Desktop Workspace -->
  <main class="desktop" id="desktop">
    <!-- Terminal Window -->
    <section class="window active" id="win-terminal" style="top: 44px; left: 32px; width: 650px; height: 440px;">
      <div class="win-header" data-drag="win-terminal">
        <span id="termTitle">ghost@kerala-node:~</span>
        <div class="win-btns">
          <button onclick="toggleWin('win-terminal')">_</button>
        </div>
      </div>
      <div class="term-body" id="termOut"></div>
      <form class="term-input-row" id="termForm">
        <span class="prompt" id="promptLabel">ghost@kerala-node:~$</span>
        <input type="text" id="termIn" autocomplete="off" spellcheck="false" autofocus>
      </form>
    </section>

    <!-- Mission Brief Window -->
    <section class="window" id="win-mission" style="top: 44px; left: 705px; width: 350px; height: 240px;">
      <div class="win-header" data-drag="win-mission">
        <span>mission_brief.txt</span>
        <div class="win-btns">
          <button onclick="toggleWin('win-mission')">_</button>
        </div>
      </div>
      <div class="win-content" id="missionText"></div>
    </section>

    <!-- Network Map Window -->
    <section class="window" id="win-netmap" style="top: 304px; left: 705px; width: 350px; height: 220px;">
      <div class="win-header" data-drag="win-netmap">
        <span>netmap // subnet_radar</span>
        <div class="win-btns">
          <button onclick="toggleWin('win-netmap')">_</button>
        </div>
      </div>
      <div class="win-content" id="netMapBody">
        <p class="line-dim">Run <code>scan</code> in terminal to map active subnet nodes.</p>
      </div>
    </section>
  </main>

  <!-- Bottom Dock -->
  <footer class="dock">
    <button onclick="toggleWin('win-terminal')">Terminal</button>
    <button onclick="toggleWin('win-mission')">Missions</button>
    <button onclick="toggleWin('win-netmap')">NetMap</button>
    <button id="soundToggle" onclick="toggleAudio()">SFX: ON</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
